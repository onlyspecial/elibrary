<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 - 电子图书馆</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="brand"><a th:href="@{/}">电子图书馆</a></div>
  <nav class="nav">
    <a th:href="@{/}">首页</a>
    <a th:href="@{/register}">注册</a>
  </nav>
</header>

<main class="content narrow">
  <h1>登录</h1>
  <div th:if="${message}" class="flash ok" th:text="${message}"></div>
  <div th:if="${param.error}" class="flash err">用户名或密码错误</div>
  <div th:if="${param.logout}" class="flash ok">已退出登录</div>

  <form th:action="@{/login}" method="post" class="auth-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>
      用户名
      <input type="text" name="username" required="required" autocomplete="username"/>
    </label>
    <label>
      密码
      <input type="password" name="password" required="required" autocomplete="current-password"/>
    </label>
    <button type="submit">登录</button>
  </form>
  <p class="hint">还没有账号？<a th:href="@{/register}">立即注册</a></p>
</main>

<footer class="site-footer">
  <p>电子图书馆服务</p>
</footer>
</body>
</html>
