<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: '电子书'">电子书</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="brand"><a th:href="@{/}">电子图书馆</a></div>
  <nav class="nav">
    <a th:href="@{/}">首页</a>
    <a th:href="@{/admin/physical}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">实体管理</a>
    <a th:href="@{/admin/digital}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">电子书管理</a>
    <a th:href="@{/admin/users}" sec:authorize="hasRole('SUPER_ADMIN')">用户管理</a>
    <span sec:authorize="isAuthenticated()" class="user-info" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">退出</button>
    </form>
  </nav>
</header>

<main class="content narrow">
  <div th:if="${error}" class="flash err" th:text="${error}"></div>
  <h1 th:text="${editing} ? '编辑电子书' : '上传电子书'">电子书</h1>

  <form th:action="@{${formAction}}" method="post" enctype="multipart/form-data" class="auth-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>
      标题
      <input type="text" name="title" th:value="${item.title}" required="required"/>
    </label>
    <label>
      作者
      <input type="text" name="author" th:value="${item.author}" required="required"/>
    </label>
    <label>
      类型
      <select name="contentType">
        <option th:each="ct : ${contentTypes}"
                th:value="${ct}"
                th:text="${ct}"
                th:selected="${item.contentType != null and item.contentType == ct}">BOOK</option>
      </select>
    </label>
    <label>
      描述
      <textarea name="description" rows="4" th:text="${item.description}"></textarea>
    </label>
    <label>
      ISBN/ISSN
      <input type="text" name="isbnOrIssn" th:value="${item.isbnOrIssn}"/>
    </label>
    <label>
      PDF 文件
      <input type="file" name="pdfFile" accept=".pdf,application/pdf"
             th:required="${!editing}"/>
    </label>
    <p th:if="${editing and item.pdfOriginalName != null}" class="hint">
      当前文件：<span th:text="${item.pdfOriginalName}">file.pdf</span>（留空则保留）
    </p>
    <button type="submit" th:text="${editing} ? '保存' : '上传'">保存</button>
    <a th:href="@{/admin/digital}">返回列表</a>
  </form>
</main>

<footer class="site-footer">
  <p>电子图书馆服务</p>
</footer>
</body>
</html>
