<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: '实体书目'">实体书目</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="brand"><a th:href="@{/}">电子图书馆</a></div>
  <nav class="nav">
    <a th:href="@{/}">首页</a>
    <a th:href="@{/admin/physical}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">实体管理</a>
    <a th:href="@{/admin/digital}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">电子书管理</a>
    <a th:href="@{/admin/users}" sec:authorize="hasRole('SUPER_ADMIN')">用户管理</a>
    <span sec:authorize="isAuthenticated()" class="user-info" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">退出</button>
    </form>
  </nav>
</header>

<main class="content narrow">
  <div th:if="${error}" class="flash err" th:text="${error}"></div>
  <h1 th:text="${editing} ? '编辑实体书目' : '新建实体书目'">实体书目</h1>

  <form th:action="@{${formAction}}" method="post" class="auth-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>
      标题
      <input type="text" name="title" th:value="${work.title}" required="required"/>
    </label>
    <label>
      作者
      <input type="text" name="author" th:value="${work.author}" required="required"/>
    </label>
    <label>
      类型
      <select name="contentType">
        <option th:each="ct : ${contentTypes}"
                th:value="${ct}"
                th:text="${ct}"
                th:selected="${work.contentType != null and work.contentType == ct}">BOOK</option>
      </select>
    </label>
    <label>
      描述
      <textarea name="description" rows="4" th:text="${work.description}"></textarea>
    </label>
    <label>
      ISBN/ISSN
      <input type="text" name="isbnOrIssn" th:value="${work.isbnOrIssn}"/>
    </label>
    <button type="submit" th:text="${editing} ? '保存' : '创建'">保存</button>
    <a th:href="@{/admin/physical}">返回列表</a>
  </form>
</main>

<footer class="site-footer">
  <p>电子图书馆服务</p>
</footer>
</body>
</html>
