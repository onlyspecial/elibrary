<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: '复本管理'">复本管理</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="brand"><a th:href="@{/}">电子图书馆</a></div>
  <nav class="nav">
    <a th:href="@{/}">首页</a>
    <a th:href="@{/admin/physical}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">实体管理</a>
    <a th:href="@{/admin/digital}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">电子书管理</a>
    <a th:href="@{/admin/users}" sec:authorize="hasRole('SUPER_ADMIN')">用户管理</a>
    <span sec:authorize="isAuthenticated()" class="user-info" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">退出</button>
    </form>
  </nav>
</header>

<main class="content">
  <div th:if="${message}" class="flash ok" th:text="${message}"></div>
  <div th:if="${error}" class="flash err" th:text="${error}"></div>

  <h1>复本管理</h1>
  <p>
    书目：<strong th:text="${work.title}">标题</strong>
    （<span th:text="${work.deleted} ? '已下架' : '上架'">上架</span>）
  </p>
  <p><a th:href="@{/admin/physical}">返回书目列表</a></p>

  <form th:action="@{/admin/physical/{id}/copies(id=${work.id})}" method="post" class="search-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>
      复本编号
      <input type="text" name="copyNo" required="required" placeholder="如 C001"/>
    </label>
    <button type="submit">添加复本</button>
  </form>

  <p th:if="${#lists.isEmpty(copies)}" class="hint">暂无复本</p>

  <table class="data-table" th:if="${!#lists.isEmpty(copies)}">
    <thead>
    <tr>
      <th>编号</th>
      <th>状态</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="copy : ${copies}">
      <td th:text="${copy.copyNo}">C001</td>
      <td th:text="${copy.status}">AVAILABLE</td>
      <td>
        <form th:action="@{/admin/physical/copies/{copyId}/delete(copyId=${copy.id})}"
              method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="workId" th:value="${work.id}"/>
          <button type="submit">下架</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>

<footer class="site-footer">
  <p>电子图书馆服务</p>
</footer>
</body>
</html>
