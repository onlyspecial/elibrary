<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: '书目详情'">书目详情</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="brand"><a th:href="@{/}">电子图书馆</a></div>
  <nav class="nav">
    <a th:href="@{/}">首页</a>
    <a th:href="@{/physical}">实体馆藏</a>
    <a th:href="@{/digital}">电子书</a>
    <a th:href="@{/my-borrows}" sec:authorize="isAuthenticated()">我的借阅</a>
    <a th:href="@{/admin/physical}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">实体管理</a>
    <a th:href="@{/admin/digital}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">电子书管理</a>
    <a th:href="@{/admin/users}" sec:authorize="hasRole('SUPER_ADMIN')">用户管理</a>
    <span sec:authorize="isAuthenticated()" class="user-info" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">退出</button>
    </form>
    <a th:href="@{/login}" sec:authorize="!isAuthenticated()">登录</a>
    <a th:href="@{/register}" sec:authorize="!isAuthenticated()">注册</a>
  </nav>
</header>

<main class="content">
  <div th:if="${message}" class="flash ok" th:text="${message}"></div>
  <div th:if="${error}" class="flash err" th:text="${error}"></div>

  <p><a th:href="@{/physical}">← 返回列表</a></p>

  <h1 th:text="${work.title}">标题</h1>
  <dl class="detail-list">
    <dt>作者</dt>
    <dd th:text="${work.author}">作者</dd>
    <dt>类型</dt>
    <dd th:text="${work.contentType}">BOOK</dd>
    <dt>ISBN/ISSN</dt>
    <dd th:text="${work.isbnOrIssn} ?: '—'">—</dd>
    <dt>可借/总册</dt>
    <dd>
      <span th:text="${work.availableCount}">0</span>/<span th:text="${work.totalCount}">0</span>
    </dd>
    <dt>简介</dt>
    <dd th:text="${work.description} ?: '暂无简介'">简介</dd>
  </dl>

  <div sec:authorize="isAuthenticated()">
    <form th:action="@{/borrow/works/{workId}(workId=${work.id})}" method="post" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn"
              th:disabled="${work.availableCount &lt;= 0}">借阅</button>
    </form>
  </div>
  <p sec:authorize="!isAuthenticated()" class="hint">
    <a th:href="@{/login}">登录</a>后可借阅
  </p>
</main>

<footer class="site-footer">
  <p>电子图书馆服务</p>
</footer>
</body>
</html>
