<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: '用户管理'">用户管理</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="site-header">
  <div class="brand"><a th:href="@{/}">电子图书馆</a></div>
  <nav class="nav">
    <a th:href="@{/}">首页</a>
    <a th:href="@{/admin/physical}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">实体管理</a>
    <a th:href="@{/admin/digital}" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">电子书管理</a>
    <a th:href="@{/admin/users}" sec:authorize="hasRole('SUPER_ADMIN')">用户管理</a>
    <span sec:authorize="isAuthenticated()" class="user-info" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">退出</button>
    </form>
  </nav>
</header>

<main class="content">
  <div th:if="${message}" class="flash ok" th:text="${message}"></div>
  <div th:if="${error}" class="flash err" th:text="${error}"></div>

  <h1>用户管理</h1>

  <p th:if="${#lists.isEmpty(users)}" class="hint">暂无用户</p>

  <table class="data-table" th:if="${!#lists.isEmpty(users)}">
    <thead>
    <tr>
      <th>ID</th>
      <th>用户名</th>
      <th>角色</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.id}">1</td>
      <td th:text="${u.username}">alice</td>
      <td th:text="${u.role}">READER</td>
      <td class="actions">
        <span th:if="${u.role.name() == 'SUPER_ADMIN'}" class="hint">不可操作</span>
        <form th:if="${u.role.name() == 'READER'}"
              th:action="@{/admin/users/{id}/grant-admin(id=${u.id})}"
              method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit">设为管理员</button>
        </form>
        <form th:if="${u.role.name() == 'ADMIN'}"
              th:action="@{/admin/users/{id}/revoke-admin(id=${u.id})}"
              method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit">撤销管理员</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>

<footer class="site-footer">
  <p>电子图书馆服务</p>
</footer>
</body>
</html>
